<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo de Partículas de Neón</title>
    
    <style>
        /* Reseteamos márgenes y evitamos barras de desplazamiento */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080808; /* Un fondo muy oscuro para resaltar el neón */
            font-family: 'Inter', sans-serif;
        }

        /* El canvas ocupará toda la pantalla */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Un pequeño texto flotante que sirve como instrucción (desaparece al mover el mouse) */
        #instrucciones {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
            pointer-events: none; /* Permite que el mouse interactúe con el canvas detrás del texto */
            transition: opacity 0.5s ease;
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="instrucciones">Mueve el cursor por la pantalla</div>
    <canvas id="neonCanvas"></canvas>

    <script>
        const canvas = document.getElementById('neonCanvas');
        const ctx = canvas.getContext('2d');
        const instrucciones = document.getElementById('instrucciones');

        let particulas = [];
        const numParticulas = 150; // Cantidad de partículas en pantalla

        // Colores de neón brillantes
        const coloresNeon = ['#00ffff', '#ff00ff', '#00ffaa', '#ffff00', '#ff5500'];

        // Objeto para rastrear la posición del mouse
        const mouse = {
            x: null,
            y: null,
            radio: 200 // El radio de atracción del cursor
        };

        // Ajustar el tamaño del canvas a la pantalla
        function redimensionarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', redimensionarCanvas);
        redimensionarCanvas();

        // Eventos para actualizar la posición del mouse
        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
            instrucciones.style.opacity = '0'; // Oculta el texto al moverse
        });

        // Eventos para soporte táctil en móviles
        window.addEventListener('touchmove', function(event) {
            mouse.x = event.touches[0].clientX;
            mouse.y = event.touches[0].clientY;
            instrucciones.style.opacity = '0';
        });

        // Limpiar la posición del mouse cuando sale de la pantalla
        window.addEventListener('mouseout', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        class Particula {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Velocidad aleatoria inicial (flotación lenta)
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radioOriginal = Math.random() * 2 + 1; // Tamaño base
                this.radio = this.radioOriginal;
                this.color = coloresNeon[Math.floor(Math.random() * coloresNeon.length)];
                this.friccion = 0.95; // Frena suavemente a la partícula
                this.velocidadMaxima = 8;
            }

            dibujar() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                
                // Efecto de resplandor (Glow) usando sombras en el canvas
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                ctx.fill();
                ctx.closePath();
                
                // Reseteamos el resplandor para no afectar otros elementos
                ctx.shadowBlur = 0; 
            }

            actualizar() {
                // Si el mouse está en la pantalla, calculamos la atracción
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distancia = Math.sqrt(dx * dx + dy * dy);

                    // Si la partícula está dentro del radio de atracción del mouse
                    if (distancia < mouse.radio) {
                        // Calcula una fuerza proporcional a qué tan cerca está
                        const fuerzaDireccionX = dx / distancia;
                        const fuerzaDireccionY = dy / distancia;
                        const fuerzaAtraccion = (mouse.radio - distancia) / mouse.radio;
                        
                        // Aplica la fuerza a la velocidad
                        this.vx += fuerzaDireccionX * fuerzaAtraccion * 0.8;
                        this.vy += fuerzaDireccionY * fuerzaAtraccion * 0.8;
                        
                        // Aumenta ligeramente el tamaño de la partícula al ser atraída
                        if (this.radio < this.radioOriginal * 2.5) {
                            this.radio += 0.2;
                        }
                    } else {
                        // Si está lejos, vuelve lentamente a su tamaño normal
                        if (this.radio > this.radioOriginal) {
                            this.radio -= 0.1;
                        }
                    }
                } else {
                     if (this.radio > this.radioOriginal) {
                        this.radio -= 0.1;
                    }
                }

                // Limita la velocidad máxima para que no salgan disparadas sin control
                let velocidadActual = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (velocidadActual > this.velocidadMaxima) {
                    this.vx = (this.vx / velocidadActual) * this.velocidadMaxima;
                    this.vy = (this.vy / velocidadActual) * this.velocidadMaxima;
                }

                // Aplica fricción para un movimiento más natural
                this.vx *= this.friccion;
                this.vy *= this.friccion;

                // Mueve la partícula
                this.x += this.vx;
                this.y += this.vy;

                // Rebote en los bordes de la pantalla
                if (this.x + this.radio > canvas.width || this.x - this.radio < 0) {
                    this.vx = -this.vx * 0.8; // Rebote perdiendo un poco de energía
                    this.x = Math.max(this.radio, Math.min(canvas.width - this.radio, this.x)); // Mantener dentro
                }
                if (this.y + this.radio > canvas.height || this.y - this.radio < 0) {
                    this.vy = -this.vy * 0.8;
                    this.y = Math.max(this.radio, Math.min(canvas.height - this.radio, this.y));
                }

                // Para evitar que se queden totalmente estáticas, añadimos un micro-movimiento aleatorio (flotación)
                if (Math.abs(this.vx) < 0.1 && Math.abs(this.vy) < 0.1) {
                    this.vx += (Math.random() - 0.5) * 0.2;
                    this.vy += (Math.random() - 0.5) * 0.2;
                }

                this.dibujar();
            }
        }

        function iniciar() {
            particulas = [];
            for (let i = 0; i < numParticulas; i++) {
                particulas.push(new Particula());
            }
        }

        function animar() {
            requestAnimationFrame(animar);
            
            // Efecto de rastro: En lugar de borrar todo con un color sólido, 
            // dibujamos un rectángulo semi-transparente negro encima en cada frame.
            ctx.fillStyle = 'rgba(8, 8, 8, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Actualizar todas las partículas
            for (let i = 0; i < particulas.length; i++) {
                particulas[i].actualizar();
            }
        }

        // Arrancar la simulación
        iniciar();
        animar();

    </script>
</body>
</html>
