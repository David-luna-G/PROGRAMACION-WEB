<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de Colaboración UML - Compra en MADAtech</title>
  <desc id="description">Interacción entre el cliente, la interfaz web, el servidor MADAtech y la base de datos para consultar un producto y registrar una compra.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="reply" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .object { stroke-width: 2; rx: 13; }
      .object-label { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .object-type { font-size: 14px; fill: #475569; text-anchor: middle; }
      .message { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .response { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#reply); }
      .label-bg { fill: #fff; opacity: .96; }
      .label { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .legend { font-size: 14px; fill: #475569; }
      .actor { fill: #eff6ff; stroke: #3b82f6; }
      .web { fill: #ecfdf5; stroke: #10b981; }
      .api { fill: #f0fdf4; stroke: #16a34a; }
      .db { fill: #fff7ed; stroke: #f97316; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>
  <text class="title" x="600" y="55" text-anchor="middle">Diagrama de Colaboración UML</text>
  <text class="subtitle" x="600" y="83" text-anchor="middle">Proceso de compra de un producto · MADAtech</text>

  <rect class="object actor" x="55" y="150" width="215" height="90"/>
  <text class="object-label" x="162.5" y="188">cliente: Cliente</text>
  <text class="object-type" x="162.5" y="215">Actor</text>

  <rect class="object web" x="350" y="150" width="225" height="90"/>
  <text class="object-label" x="462.5" y="188">tienda: Interfaz web</text>
  <text class="object-type" x="462.5" y="215">Página de MADAtech</text>

  <rect class="object api" x="660" y="150" width="235" height="90"/>
  <text class="object-label" x="777.5" y="188">api: Servidor MADAtech</text>
  <text class="object-type" x="777.5" y="215">API</text>

  <rect class="object db" x="965" y="150" width="190" height="90"/>
  <text class="object-label" x="1060" y="188">bd: Base de datos</text>
  <text class="object-type" x="1060" y="215">MySQL</text>

  <path class="message" d="M270 285 L350 285"/>
  <rect class="label-bg" x="255" y="258" width="160" height="24" rx="5"/>
  <text class="label" x="335" y="276">1: selecciona producto</text>

  <path class="message" d="M575 335 L660 335"/>
  <rect class="label-bg" x="566" y="308" width="178" height="24" rx="5"/>
  <text class="label" x="655" y="326">1.1: consultarProducto(id)</text>

  <path class="message" d="M895 385 L965 385"/>
  <rect class="label-bg" x="872" y="358" width="182" height="24" rx="5"/>
  <text class="label" x="963" y="376">1.2: buscar producto y stock</text>

  <path class="response" d="M965 435 L895 435"/>
  <rect class="label-bg" x="870" y="408" width="180" height="24" rx="5"/>
  <text class="label" x="960" y="426">1.3: datos del producto</text>

  <path class="response" d="M660 485 L575 485"/>
  <rect class="label-bg" x="566" y="458" width="178" height="24" rx="5"/>
  <text class="label" x="655" y="476">1.4: mostrar producto</text>

  <path class="message" d="M270 535 L350 535"/>
  <rect class="label-bg" x="267" y="508" width="150" height="24" rx="5"/>
  <text class="label" x="342" y="526">2: confirma compra</text>

  <path class="message" d="M575 585 L660 585"/>
  <rect class="label-bg" x="562" y="558" width="184" height="24" rx="5"/>
  <text class="label" x="654" y="576">2.1: crearPedido(carrito)</text>

  <path class="message" d="M895 635 L965 635"/>
  <rect class="label-bg" x="879" y="608" width="168" height="24" rx="5"/>
  <text class="label" x="963" y="626">2.2: validar stock</text>

  <path class="message" d="M895 685 L965 685"/>
  <rect class="label-bg" x="871" y="658" width="184" height="24" rx="5"/>
  <text class="label" x="963" y="676">2.3: registrar pedido</text>

  <path class="response" d="M965 735 L895 735"/>
  <rect class="label-bg" x="870" y="708" width="180" height="24" rx="5"/>
  <text class="label" x="960" y="726">2.4: pedido registrado</text>

  <path class="response" d="M660 770 L575 770"/>
  <rect class="label-bg" x="566" y="743" width="178" height="24" rx="5"/>
  <text class="label" x="655" y="761">2.5: confirmar compra</text>

  <path class="response" d="M350 820 L270 820"/>
  <rect class="label-bg" x="247" y="793" width="160" height="24" rx="5"/>
  <text class="label" x="327" y="811">3: mostrar confirmación</text>

  <line x1="55" y1="860" x2="105" y2="860" class="message"/>
  <text class="legend" x="118" y="865">Solicitud</text>
  <line x1="225" y1="860" x2="275" y2="860" class="response"/>
  <text class="legend" x="288" y="865">Respuesta</text>
</svg>
